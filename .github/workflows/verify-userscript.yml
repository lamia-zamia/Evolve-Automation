name: Verify userscript

on:
  push:
    branches: [master, split]
    paths:
      - "src/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - "tests/**"
      - "evolve_automation.user.js"
      - "evolve_automation.meta.js"
      - ".github/workflows/verify-userscript.yml"
  pull_request:
    paths:
      - "src/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - "tests/**"
      - "evolve_automation.user.js"
      - "evolve_automation.meta.js"
      - ".github/workflows/verify-userscript.yml"

permissions:
  contents: read

concurrency:
  group: userscript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and verify committed output
        run: npm run verify

      - name: Fetch current and initial pinned DeadSpace sources for grant-manifest verification
        run: |
          git init "$RUNNER_TEMP/evolve-source"
          git -C "$RUNNER_TEMP/evolve-source" remote add origin https://github.com/pmotschmann/Evolve.git
          git -C "$RUNNER_TEMP/evolve-source" fetch --depth=1 origin 6cc9ba8ce714e9ef474b468be93b4c7edfb98830 db38e2af831907d49aeb5348d678d8d8745d6c3f

      - name: Verify the grant manifest against the pinned upstream input
        run: node scripts/generate-captured-grant-actions.mjs --upstream="$RUNNER_TEMP/evolve-source" --check
