name: Verify userscript

on:
  push:
    branches: [master, split]
    paths:
      - "src/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "evolve_automation.user.js"
      - "evolve_automation.meta.js"
      - ".github/workflows/verify-userscript.yml"
  pull_request:
    paths:
      - "src/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "evolve_automation.user.js"
      - "evolve_automation.meta.js"
      - ".github/workflows/verify-userscript.yml"

permissions:
  contents: read

concurrency:
  group: userscript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and verify committed output
        run: npm run verify
